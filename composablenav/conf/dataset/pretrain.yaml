    dynamic_obstacle:
      max_num_obstacles: 10
      min_num_obstacles: 1
    static_obstacle:
      min_num_obstacles: 1
      max_num_obstacles: 6

  generation:
    num_dynamic: 30000
    num_avoid: 10000

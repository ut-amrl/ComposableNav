    num_plans: 5
    num_goals: 8
    max_expand_node_num: 10000 # hybrid astar
    min_subgoals: 0 # rrt
    max_subgoals: 3 # rrt
    rrt_paths: 1 # rrt
    num_proc: -1
    split_train_percentage: 0.95
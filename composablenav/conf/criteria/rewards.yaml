    _target_: composablenav.misc.critic.yield_reward
    _partial_: true 

    # args
    obstacle_width: 1
    obstacle_front_min_dist: 0.5
    obstacle_front_max_dist: 4
    goal_radius: 2

  walk_over:
    _target_: composablenav.misc.critic.walk_over_reward
    _partial_: true 

    # args
    goal_radius: 2

    _partial_: true 

    # args
    pass_from_direction: left
    goal_radius: 2

  pass_from_right:
    _target_: composablenav.misc.critic.pass_from_reward
    _partial_: true 

    # args
    pass_from_direction: right
    goal_radius: 2

  follow:
